<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img"
     aria-labelledby="title desc">
  <title id="title">Layer-1 accepted external and business-UOW medians</title>
  <desc id="desc">Separate horizontal bars compare PRE OCC and IN pessimistic
  median external elapsed and application business-UOW elapsed in milliseconds.
  The metrics are not stacked.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #24313b; }
    .title { font-size: 22px; font-weight: 650; }
    .subtitle { font-size: 13px; fill: #5c6872; }
    .axis { stroke: #aeb8bf; stroke-width: 1; }
    .grid { stroke: #dfe5e9; stroke-width: 1; }
    .tick { font-size: 12px; fill: #5c6872; }
    .label { font-size: 14px; font-weight: 600; }
    .value { font-size: 13px; font-variant-numeric: tabular-nums; }
    .pre { fill: #3f6682; }
    .in { fill: #87939c; }
    .frame { fill: none; stroke: #c8d0d5; stroke-width: 1; }
  </style>

  <text class="title" x="40" y="38">Layer 1 — Accepted-path medians</text>
  <text class="subtitle" x="40" y="62">
    External elapsed and application business-UOW elapsed are separate metrics
  </text>

  <rect class="pre" x="620" y="82" width="18" height="12"/>
  <text class="tick" x="645" y="93">PRE/OCC</text>
  <rect class="in" x="735" y="82" width="18" height="12"/>
  <text class="tick" x="760" y="93">IN/pessimistic</text>

  <rect class="frame" x="220" y="118" width="632" height="276"/>
  <line class="grid" x1="220" y1="118" x2="220" y2="394"/>
  <line class="grid" x1="396" y1="118" x2="396" y2="394"/>
  <line class="grid" x1="571" y1="118" x2="571" y2="394"/>
  <line class="grid" x1="747" y1="118" x2="747" y2="394"/>
  <line class="grid" x1="835" y1="118" x2="835" y2="394"/>

  <text class="tick" x="220" y="416" text-anchor="middle">0</text>
  <text class="tick" x="396" y="416" text-anchor="middle">1</text>
  <text class="tick" x="571" y="416" text-anchor="middle">2</text>
  <text class="tick" x="747" y="416" text-anchor="middle">3</text>
  <text class="tick" x="835" y="416" text-anchor="middle">3.5</text>
  <text class="label" x="536" y="450" text-anchor="middle">
    Median elapsed (ms)
  </text>

  <text class="label" x="202" y="166" text-anchor="end">External elapsed</text>
  <rect class="pre" x="220" y="138" width="582" height="28"/>
  <text class="value" x="810" y="158">3.3151455 ms</text>
  <rect class="in" x="220" y="174" width="545" height="28"/>
  <text class="value" x="773" y="194">3.1029165 ms</text>

  <text class="label" x="202" y="286" text-anchor="end">
    Application business UOW
  </text>
  <rect class="pre" x="220" y="258" width="346" height="28"/>
  <text class="value" x="574" y="278">1.969396 ms</text>
  <rect class="in" x="220" y="294" width="537" height="28"/>
  <text class="value" x="765" y="314">3.054875 ms</text>

  <text class="subtitle" x="220" y="370">
    Independent medians from Layer-1 paths A and F; bars are not stacked.
  </text>
</svg>
